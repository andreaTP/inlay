name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# When a new revision is pushed to a PR, cancel all in-progress CI runs for that
# PR. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Build wkg wasm module
        working-directory: wkg-wasm
        run: make build

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wkg-wasm
          path: wkg-wasm/wkg.wasm

  test:
    needs: build-wasm
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: [11, 25]

    steps:
      - uses: actions/checkout@v7

      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: wkg-wasm
          path: wkg-wasm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ matrix.java-version }}'
          cache: maven

      - name: Build and test
        run: mvn -B verify ${{ matrix.os == 'macos-latest' && '-Pno-docker' || '' }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
